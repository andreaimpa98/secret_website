<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👁️ Secret Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a1a 50%, #0a0a0a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Effetto particelle */
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 10s infinite;
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-100vh) translateX(50px) scale(0);
                opacity: 0;
            }
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(20, 20, 20, 0.95);
            border: 3px solid;
            border-image: linear-gradient(135deg, #ff0080, #7928ca, #ff0080) 1;
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 60px rgba(255, 0, 128, 0.3),
                        inset 0 0 60px rgba(121, 40, 202, 0.1);
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 60px rgba(255, 0, 128, 0.3),
                            inset 0 0 60px rgba(121, 40, 202, 0.1);
            }
            50% {
                box-shadow: 0 0 80px rgba(255, 0, 128, 0.5),
                            inset 0 0 80px rgba(121, 40, 202, 0.2);
            }
        }

        .eye {
            font-size: 80px;
            margin-bottom: 20px;
            animation: blink 4s infinite;
            display: inline-block;
        }

        @keyframes blink {
            0%, 48%, 52%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff0080, #7928ca, #ff0080);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            letter-spacing: 2px;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .message {
            color: #fff;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .highlight {
            color: #ff0080;
            font-weight: bold;
            font-size: 20px;
        }

        .divider {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #7928ca, transparent);
            margin: 30px auto;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scaleX(1); }
            50% { opacity: 1; transform: scaleX(1.1); }
        }

        .subtitle {
            color: #ccc;
            font-size: 16px;
            font-style: italic;
            margin-bottom: 40px;
        }

        .button {
            display: inline-block;
            padding: 18px 50px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            background: linear-gradient(135deg, #ff0080, #7928ca);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 0, 128, 0.4);
            position: relative;
            overflow: hidden;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .button:hover::before {
            width: 300px;
            height: 300px;
        }

        .button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 0, 128, 0.6);
        }

        .button-text {
            position: relative;
            z-index: 1;
        }

        .mask-icon {
            font-size: 30px;
            margin-bottom: 20px;
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 40px;
            color: #888;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* Effetto glitch sul titolo */
        .glitch {
            position: relative;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch::before {
            animation: glitch-1 2s infinite;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            transform: translate(-2px, -2px);
            opacity: 0.8;
        }

        .glitch::after {
            animation: glitch-2 2s infinite;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
            transform: translate(2px, 2px);
            opacity: 0.8;
        }

        @keyframes glitch-1 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }

        @keyframes glitch-2 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(2px, -2px); }
            40% { transform: translate(2px, 2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(-2px, 2px); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            .title {
                font-size: 24px;
            }

            .message {
                font-size: 16px;
            }

            .button {
                padding: 15px 35px;
                font-size: 16px;
            }

            .eye {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="eye">👁️</div>
        
        <div class="title glitch" data-text="COMPLIMENTI">COMPLIMENTI</div>
        
        <div class="message">
            Se sei arrivat* fin qui, vuol dire che <span class="highlight">presti attenzione ai dettagli</span>.
        </div>

        <div class="message">
            E chi presta attenzione ai dettagli... <br>
            merita un <span class="highlight">aiuto esclusivo</span>.
        </div>

        <div class="divider"></div>

        <div class="subtitle">
            Trasformarsi richiede tempo. Noi ti diamo il vantaggio.
        </div>

        <div class="mask-icon">🎭</div>

        <a href="https://it.costumalia.com/collections/costume-coppia" class="button">
            <span class="button-text">SCOPRI I COSTUMI →</span>
        </a>

        <div class="footer">
            WHO ARE YOU TONIGHT? • ALTER EGO AWAITS
        </div>
    </div>

    <script>
        // Crea particelle fluttuanti
        function createParticles() {
            const particleCount = 50;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                document.body.appendChild(particle);
            }
        }

        createParticles();

        // Effetto suono al click (opzionale)
        document.querySelector('.button').addEventListener('click', function() {
            // Aggiungi un piccolo effetto prima del redirect
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 100);
        });
    </script>
</body>
</html>
